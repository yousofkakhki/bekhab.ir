services:
  bekhab-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: bekhab-prod
    ports:
      - "127.0.0.1:3003:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bekhab-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bekhab-dev
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    environment:
      - NODE_ENV=development
